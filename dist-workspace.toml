[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["msi", "shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Files to include in archives/installers
include = ["README.md", "LICENSE"]
# Checksum algorithm
checksum = "sha256"
# Allow custom workflow modifications (CI is hand-tuned). MSI/WiX is dist-managed:
# wix/main.wxs is generated via `dist generate --mode msi` and validated on every build.
allow-dirty = ["ci"]
